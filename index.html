<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digisellix - Buy & Sell Digital Products | Templates, Design Assets & More</title>
    <meta name="description" content="Discover premium digital products on Digisellix. Buy editable design bundles, templates, PLR resources, software & creative assets. Start selling your digital products today." />
    <meta name="author" content="Digisellix" />
    <meta name="keywords" content="buy digital products, sell digital products online, design bundles download, PLR design resources, digital assets for creators, templates marketplace" />
    <link rel="canonical" href="https://digisellix.com/" />
    
    <!-- Robots -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Digisellix - Buy & Sell Digital Products | Templates, Design Assets & More" />
    <meta property="og:description" content="Discover premium digital products on Digisellix. Buy editable design bundles, templates, PLR resources & creative assets." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://digisellix.com/" />
    <meta property="og:site_name" content="Digisellix" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="id_ID" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Digisellix - Buy & Sell Digital Products" />
    <meta name="twitter:description" content="Discover premium digital products. Buy editable design bundles, templates & creative assets." />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    
    <!-- Additional SEO -->
    <meta name="theme-color" content="#8B5CF6" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    
    <!-- Organization Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Digisellix",
      "url": "https://digisellix.com",
      "logo": "https://digisellix.com/favicon.ico",
      "description": "Global marketplace for buying and selling digital products including design bundles, templates, and creative assets.",
      "sameAs": [],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "availableLanguage": ["English", "Indonesian"]
      }
    }
    </script>
    
    <!-- WebSite Schema with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Digisellix",
      "url": "https://digisellix.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://digisellix.com/products?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
